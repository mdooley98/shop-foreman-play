<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#17221B">
		<title>Shop Foreman</title>
		<!--
		Shop Foreman loading page (v0.1.13). Based on Godot 4.7.2's default web shell; the engine
		start-up code below is unchanged. Changed: colours, our own progress bar and line of text.
		The picture is the boot splash (game/assets/splash.png, drawn by tools/splash_draft.gd).
		On phones taller than the picture, the bands above and below match the wall and floor.
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #E8EFE9;
	background-color: #0E1511;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	/* Above the picture: the wall, with its stripes (4 px every 36 px of the 720 px picture,
	   which is as wide as the screen on a phone). Below it: the floor colour. */
	background:
		repeating-linear-gradient(to right, #26372C 0, #26372C 0.556vw, #17221B 0.556vw, #17221B 5vw) top / 100% 50% no-repeat,
		#1B2820;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: contain;
}

#status-splash.show-image--false {
	display: none;
}

#status-loading {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(7% + env(safe-area-inset-bottom, 0px));
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 14px;
}

#status-track {
	width: min(56vw, 400px);
	height: 8px;
	border-radius: 4px;
	background-color: #26372C;
	overflow: hidden;
}

#status-fill {
	width: 0%;
	height: 100%;
	border-radius: 4px;
	background-color: #8CC63E;
	transition: width 0.2s linear;
}

#status-fill.waiting {
	width: 30%;
	animation: sf-wait 1.2s ease-in-out infinite alternate;
}

@keyframes sf-wait {
	from { transform: translateX(-10%); }
	to { transform: translateX(240%); }
}

#status-text {
	color: #9DB0A3;
	font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
	font-weight: 600;
	font-size: 14px;
	letter-spacing: 0.12em;
	text-align: center;
}

#status-notice {
	display: none;
	position: relative;
	background-color: #3A1D12;
	border-radius: 0.5rem;
	border: 1px solid #FF7A45;
	color: #FFB38F;
	font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<div id="status-loading">
				<div id="status-track"><div id="status-fill" class="waiting"></div></div>
				<div id="status-text">OLD FAITHFUL IS WARMING UP…</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1980680,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLoading = document.getElementById('status-loading');
	const statusFill = document.getElementById('status-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoading.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusFill.classList.remove('waiting');
					statusFill.style.width = Math.min(100, (100 * current) / total) + '%';
				} else {
					statusFill.classList.add('waiting');
					statusFill.style.width = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
